<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#100d18"/><stop offset=".5" stop-color="#17121f"/><stop offset="1" stop-color="#0b1015"/>
  </linearGradient>
  <linearGradient id="coral" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
  <linearGradient id="lime" x1="0" x2="1"><stop stop-color="#bef264"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#39204b"/><stop offset=".55" stop-color="#20152c"/><stop offset="1" stop-color="#100d18"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <pattern id="micro" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#76647d"/></pattern>
</defs>

<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect x="30" y="30" width="1140" height="360" rx="22" fill="url(#micro)" opacity=".15"/>
<circle cx="940" cy="200" r="170" fill="#e879f9" opacity=".045" filter="url(#blur)">
  <animate attributeName="r" values="140;185;140" dur="7s" repeatCount="indefinite"/>
</circle>

<!-- Header -->
<g transform="translate(58 52)">
  <rect width="48" height="3" rx="2" fill="url(#coral)"/>
  <text x="0" y="39" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#faf7fb">SmartRide</text>
  <text x="0" y="70" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#fda4af">Part B • Dataset Understanding &amp; Preparation</text>
  <text x="1" y="94" font-family="Arial,sans-serif" font-size="11" fill="#887c91">Profile • inspect • validate • prepare</text>
</g>

<!-- Left preparation pipeline -->
<g transform="translate(58 178)">
  <g>
    <rect width="174" height="132" rx="16" fill="#15111c" stroke="#382c42"/>
    <circle cx="28" cy="28" r="10" fill="#27151d" stroke="#fb7185"/>
    <text x="48" y="32" font-family="monospace" font-size="8" fill="#84758c">PROFILE</text>
    <text x="20" y="69" font-family="Arial" font-size="24" font-weight="800" fill="#f5eaf2">24.8K</text>
    <text x="20" y="91" font-family="monospace" font-size="8" fill="#766b7d">ROWS SCANNED</text>
    <path d="M20 109H154" stroke="#2d2533"/>
    <g fill="#fb7185">
      <rect x="20" y="103" width="7" height="6" rx="1"><animate attributeName="height" values="6;17;6" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="34" y="98" width="7" height="11" rx="1"><animate attributeName="height" values="11;23;11" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="48" y="101" width="7" height="8" rx="1"><animate attributeName="height" values="8;19;8" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="62" y="94" width="7" height="15" rx="1"><animate attributeName="height" values="15;27;15" dur="1.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(192)">
    <rect width="174" height="132" rx="16" fill="#14131b" stroke="#382f43"/>
    <circle cx="28" cy="28" r="10" fill="#1b2020" stroke="#4ade80"/>
    <path d="M23 28L27 32L34 23" fill="none" stroke="#86efac" stroke-width="2"/>
    <text x="48" y="32" font-family="monospace" font-size="8" fill="#84758c">INSPECT</text>
    <text x="20" y="69" font-family="Arial" font-size="24" font-weight="800" fill="#dcfce7">12</text>
    <text x="20" y="91" font-family="monospace" font-size="8" fill="#766b7d">COLUMNS MAPPED</text>
    <path d="M20 109H154" stroke="#2d2533"/>
    <g fill="#4ade80" opacity=".9">
      <circle cx="25" cy="109" r="2"><animate attributeName="cx" values="25;150;25" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="55" cy="109" r="2"><animate attributeName="cx" values="55;120;55" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g transform="translate(384)">
    <rect width="174" height="132" rx="16" fill="#16121c" stroke="#382c42"/>
    <circle cx="28" cy="28" r="10" fill="#20172b" stroke="#c084fc"/>
    <path d="M21 29h14M28 22v14" stroke="#d8b4fe" stroke-width="1.8"/>
    <text x="48" y="32" font-family="monospace" font-size="8" fill="#84758c">PREPARE</text>
    <text x="20" y="69" font-family="Arial" font-size="24" font-weight="800" fill="#f3e8ff">READY</text>
    <text x="20" y="91" font-family="monospace" font-size="8" fill="#766b7d">MODEL-READY SCHEMA</text>
    <path d="M20 109H154" stroke="#2d2533"/>
    <path d="M20 109L48 109L62 98L78 109L96 102L112 109L132 96L154 109" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
</g>

<line x1="650" y1="55" x2="650" y2="360" stroke="#2a2230"/>

<!-- Unique animated data-preparation visualization: Data Laboratory -->
<g transform="translate(920 210)">
  <!-- ambient pulse -->
  <circle r="132" fill="none" stroke="#392942" stroke-width="1" opacity=".7">
    <animate attributeName="r" values="118;145;118" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.7;.25" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- central profiling panel -->
  <rect x="-112" y="-105" width="224" height="210" rx="20"
        fill="#121018" stroke="#44364e" stroke-width="1.5"/>

  <!-- panel header -->
  <circle cx="-88" cy="-80" r="5" fill="#fb7185">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="-75" y="-76" font-family="monospace" font-size="8" fill="#96899b">DATA PROFILE</text>
  <text x="77" y="-76" font-family="monospace" font-size="7" fill="#4ade80">LIVE</text>

  <!-- column headers -->
  <g font-family="monospace" font-size="6" fill="#6f6578">
    <text x="-88" y="-55">FIELD</text>
    <text x="-20" y="-55">TYPE</text>
    <text x="30" y="-55">NULL</text>
    <text x="70" y="-55">QUALITY</text>
  </g>
  <path d="M-91-48H91" stroke="#302735"/>

  <!-- profiling rows -->
  <g font-family="monospace" font-size="7">
    <g>
      <text x="-88" y="-27" fill="#ddd6e0">distance</text>
      <text x="-20" y="-27" fill="#c4b5fd">NUM</text>
      <text x="31" y="-27" fill="#86efac">0%</text>
      <rect x="70" y="-32" width="25" height="7" rx="3.5" fill="#211d27"/>
      <rect x="70" y="-32" width="22" height="7" rx="3.5" fill="#4ade80">
        <animate attributeName="width" values="10;22;10" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <text x="-88" y="-2" fill="#ddd6e0">payment</text>
      <text x="-20" y="-2" fill="#fda4af">CAT</text>
      <text x="31" y="-2" fill="#fcd34d">2%</text>
      <rect x="70" y="-7" width="25" height="7" rx="3.5" fill="#211d27"/>
      <rect x="70" y="-7" width="18" height="7" rx="3.5" fill="#fda4af">
        <animate attributeName="width" values="8;18;8" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <text x="-88" y="23" fill="#ddd6e0">ride_time</text>
      <text x="-20" y="23" fill="#c4b5fd">DATE</text>
      <text x="31" y="23" fill="#86efac">0%</text>
      <rect x="70" y="18" width="25" height="7" rx="3.5" fill="#211d27"/>
      <rect x="70" y="18" width="24" height="7" rx="3.5" fill="#a78bfa">
        <animate attributeName="width" values="12;24;12" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <text x="-88" y="48" fill="#ddd6e0">fare</text>
      <text x="-20" y="48" fill="#c4b5fd">NUM</text>
      <text x="31" y="48" fill="#86efac">0%</text>
      <rect x="70" y="43" width="25" height="7" rx="3.5" fill="#211d27"/>
      <rect x="70" y="43" width="21" height="7" rx="3.5" fill="#bef264">
        <animate attributeName="width" values="9;21;9" dur="2.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- animated scan line -->
  <rect x="-91" y="-42" width="182" height="1.5" fill="#fff1f2" opacity=".55" filter="url(#glow)">
    <animate attributeName="y" values="-42;61;-42" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom quality meter -->
  <path d="M-91 72H91" stroke="#302735"/>
  <text x="-91" y="88" font-family="monospace" font-size="7" fill="#766b7d">DATA QUALITY</text>
  <text x="58" y="88" font-family="monospace" font-size="7" fill="#86efac">98.4%</text>
  <rect x="-91" y="94" width="182" height="3" rx="1.5" fill="#211d27"/>
  <rect x="-91" y="94" width="160" height="3" rx="1.5" fill="url(#lime)">
    <animate attributeName="width" values="145;165;145" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- orbiting inspection nodes -->
  <g filter="url(#glow)">
    <circle cx="-139" cy="-22" r="4" fill="#fb7185"/>
    <circle cx="139" cy="28" r="4" fill="#c084fc"/>
    <circle cx="0" cy="-143" r="4" fill="#bef264"/>
    <animateTransform attributeName="transform" type="rotate"
                      from="0" to="360" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- unique floating callouts -->
  <g font-family="monospace" font-size="7">
    <g transform="translate(-176 -92)">
      <rect width="64" height="22" rx="11" fill="#151119" stroke="#3b2d43"/>
      <text x="11" y="14" fill="#fda4af">PROFILE</text>
    </g>
    <g transform="translate(112 72)">
      <rect width="72" height="22" rx="11" fill="#151119" stroke="#3b2d43"/>
      <text x="10" y="14" fill="#86efac">VALIDATE ✓</text>
    </g>
  </g>

  <!-- status chip -->
  <g transform="translate(-75 125)">
    <rect width="150" height="28" rx="14" fill="#151119" stroke="#3b2d43"/>
    <circle cx="17" cy="14" r="3.5" fill="#4ade80">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" font-family="monospace" font-size="8" fill="#96899b">SCHEMA VERIFIED</text>
  </g>
</g>

<!-- Footer metrics -->
<g transform="translate(58 354)" font-family="monospace">
  <text x="0" y="0" font-size="8" fill="#69616e">ROWS</text>
  <text x="0" y="16" font-size="12" fill="#ddd6e0">24,800</text>
  <text x="125" y="0" font-size="8" fill="#69616e">COLUMNS</text>
  <text x="125" y="16" font-size="12" fill="#ddd6e0">12</text>
  <text x="225" y="0" font-size="8" fill="#69616e">TYPES</text>
  <text x="225" y="16" font-size="12" fill="#ddd6e0">3 GROUPS</text>
  <text x="350" y="0" font-size="8" fill="#69616e">STATUS</text>
  <text x="350" y="16" font-size="12" fill="#86efac">PREPARED</text>
</g>

<path d="M48 350V376H74M1152 350V376H1126" fill="none" stroke="#352b3b"/>
<circle cx="1142" cy="58" r="4" fill="#4ade80" filter="url(#glow)">
  <animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/>
</circle>
</svg>