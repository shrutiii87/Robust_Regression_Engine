        fill="#C4B5FD">
    RIDGE
  </text>


  <rect x="135" y="312"
        width="62" height="26"
        rx="13"
        fill="#8B5CF6"
        fill-opacity=".12"
        stroke="#8B5CF6"/>

  <text x="166" y="329"
        text-anchor="middle"
        fill="#C4B5FD">
    LASSO
  </text>


  <rect x="205" y="312"
        width="62" height="26"
        rx="13"
        fill="#22D3EE"
        fill-opacity=".10"
        stroke="#22D3EE"/>

  <text x="236" y="329"
        text-anchor="middle"
        fill="#67E8F9">
    SVR
  </text>


  <rect x="65" y="348"
        width="90" height="26"
        rx="13"
        fill="#22D3EE"
        fill-opacity=".08"
        stroke="#22D3EE"/>

  <text x="110" y="365"
        text-anchor="middle"
        fill="#67E8F9">
    DECISION TREE
  </text>


  <rect x="163" y="348"
        width="104" height="26"
        rx="13"
        fill="#8B5CF6"
        fill-opacity=".12"
        stroke="#8B5CF6"/>

  <text x="215" y="365"
        text-anchor="middle"
        fill="#C4B5FD">
    RANDOM FOREST
  </text>

</g>


<!-- ================================================= -->
<!-- MAIN MACHINE -->
<!-- ================================================= -->

<rect x="390" y="38"
      width="750"
      height="324"
      rx="26"
      fill="#0A0715"
      fill-opacity=".94"
      stroke="#2D2345"
      stroke-width="1.5"/>


<!-- header -->

<circle cx="420" cy="67"
        r="4"
        fill="#22D3EE">

  <animate attributeName="opacity"
           values=".3;1;.3"
           dur="2s"
           repeatCount="indefinite"/>

</circle>


<text x="440" y="72"
      fill="#70697E"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      letter-spacing="2">
  MODEL CONTROL SYSTEM
</text>


