<!-- connections -->

<g fill="none"
   stroke="#6D4DB5"
   stroke-width="1.5"
   opacity=".65">

  <path d="M540 139H620"/>
  <path d="M540 204H620"/>
  <path d="M540 269H620"/>

</g>


<!-- ================================================= -->
<!-- CENTRAL AI ENGINE -->
<!-- ================================================= -->

<g transform="translate(735 205)">

  <!-- outer pulse -->

  <circle r="82"
          fill="none"
          stroke="#8B5CF6"
          stroke-width="1"
          opacity=".15">

    <animate attributeName="r"
             values="72;90;72"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".3;0;.3"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- machine body -->

  <circle r="70"
          fill="#0E0A20"
          stroke="#49356E"
          stroke-width="2"/>


  <!-- rotating ring -->

  <g fill="none"
     stroke="url(#core)"
     stroke-width="5"
     stroke-linecap="round">

    <path d="M-42 -56 A70 70 0 0 1 42 -56"
          stroke-dasharray="18 12"/>

    <path d="M42 56 A70 70 0 0 1 -42 56"
          stroke-dasharray="18 12"/>

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="9s"
      repeatCount="indefinite"/>

  </g>


  <!-- inner core -->

  <circle r="43"
          fill="#100C20"
          stroke="#8B5CF6"
          stroke-width="2"
          filter="url(#glow)"/>


  <circle r="18"
          fill="url(#core)"
          filter="url(#glow)">

    <animate attributeName="r"
             values="15;21;15"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ML symbol -->

  <path d="M-12 8V-8
           L-4 1
           L4-8
           V8"
        fill="none"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</g>


<!-- ================================================= -->
<!-- OUTPUT -->
<!-- ================================================= -->

<path d="M805 205H860"
      stroke="#22D3EE"
      stroke-width="2"
      stroke-dasharray="5 6">

  <animate attributeName="stroke-dashoffset"
           from="0"
           to="-22"
           dur="1s"
           repeatCount="indefinite"/>

</path>


<g font-family="Arial">

  <rect x="860" y="137"
        width="205"
        height="62"
        rx="12"
        fill="#111024"
        stroke="#22D3EE"
        stroke-opacity=".55"/>

  <text x="882" y="161"
        fill="#6F687D"
        font-size="9"
        font-weight="700"
        letter-spacing="1.5">
    PREDICTION
  </text>

  <text x="882" y="184"
        fill="#FFFFFF"
        font-size="17"
        font-weight="700">
    HOUSE PRICE
  </text>


  <rect x="860" y="218"
        width="205"
        height="62"
        rx="12"
        fill="#111024"
        stroke="#8B5CF6"
        stroke-opacity=".55"/>

  <text x="882" y="242"
        fill="#6F687D"
        font-size="9"
        font-weight="700"
        letter-spacing="1.5">
    MODEL STATUS
  </text>

  <text x="882" y="265"
        fill="#C4B5FD"
        font-size="15"
        font-weight="700">
    OPTIMIZED
  </text>

</g>


<!-- ================================================= -->
<!-- MOVING DATA SIGNAL -->
<!-- ================================================= -->

<circle cx="580"
        cy="139"
        r="4"
        fill="#22D3EE"
        filter="url(#glow)">

  <animate attributeName="cx"
           values="580;615;580"
           dur="2s"
           repeatCount="indefinite"/>

</circle>


<!-- status -->

<text x="625" y="335"
      fill="#4E475D"
      font-family="Arial"
      font-size="9"
      letter-spacing="2">
  REGULARIZED • VALIDATED • PREDICTIVE
</text>

</svg>
