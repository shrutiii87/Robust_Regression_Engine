<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05030D"/>
    <stop offset="0.45" stop-color="#10071F"/>
    <stop offset="1" stop-color="#050A18"/>
  </linearGradient>

  <!-- Ambient glow -->
  <radialGradient id="purpleGlow">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanGlow">
    <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A78BFA"/>
    <stop offset=".5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <!-- Moving background wave -->
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#8B5CF6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>

</defs>


<!-- ================================================= -->
<!-- ANIMATED BACKGROUND -->
<!-- ================================================= -->

<rect width="1200" height="400" fill="url(#bg)"/>


<!-- large ambient purple light -->

<circle cx="190" cy="100" r="180"
        fill="url(#purpleGlow)">

  <animate attributeName="cx"
           values="190;280;190"
           dur="9s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="100;150;100"
           dur="7s"
           repeatCount="indefinite"/>

</circle>


<!-- large ambient cyan light -->

<circle cx="1020" cy="310" r="200"
        fill="url(#cyanGlow)">

  <animate attributeName="cx"
           values="1020;930;1020"
           dur="11s"
           repeatCount="indefinite"/>

  <animate attributeName="cy"
           values="310;260;310"
           dur="8s"
           repeatCount="indefinite"/>

</circle>


<!-- ================================================= -->
<!-- MOVING TECH GRID -->
<!-- ================================================= -->

<g stroke="#A78BFA"
   stroke-width="1"
   opacity=".045">

  <path d="M0 70H1200"/>
  <path d="M0 140H1200"/>
  <path d="M0 210H1200"/>
  <path d="M0 280H1200"/>
  <path d="M0 350H1200"/>

  <path d="M80 0V400"/>
  <path d="M160 0V400"/>
  <path d="M240 0V400"/>
  <path d="M320 0V400"/>
  <path d="M400 0V400"/>
  <path d="M480 0V400"/>
  <path d="M560 0V400"/>
  <path d="M640 0V400"/>
  <path d="M720 0V400"/>
  <path d="M800 0V400"/>
  <path d="M880 0V400"/>
  <path d="M960 0V400"/>
  <path d="M1040 0V400"/>
  <path d="M1120 0V400"/>

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;40 0;0 0"
    dur="12s"
    repeatCount="indefinite"/>

</g>


<!-- ================================================= -->
<!-- MOVING BACKGROUND LIGHT WAVE -->
<!-- ================================================= -->

<rect x="-500"
      y="0"
      width="500"
      height="400"
      fill="url(#wave)"
      opacity=".18">

  <animate attributeName="x"
           values="-500;1200"
           dur="10s"
           repeatCount="indefinite"/>

</rect>


<!-- second slower wave -->

<rect x="-700"
      y="0"
      width="350"
      height="400"
      fill="url(#wave)"
      opacity=".08">

  <animate attributeName="x"
           values="-700;1200"
           dur="15s"
           repeatCount="indefinite"/>

</rect>


<!-- ================================================= -->
<!-- FLOATING BACKGROUND PARTICLES -->
<!-- ================================================= -->

<g fill="#8B5CF6" filter="url(#glow)">

  <circle cx="45" cy="90" r="2">
    <animate attributeName="cy"
             values="90;65;90"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="330" cy="55" r="2">
    <animate attributeName="cy"
             values="55;85;55"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="355" cy="330" r="2">
    <animate attributeName="cx"
             values="355;380;355"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1145" cy="85" r="2">
    <animate attributeName="cy"
             values="85;110;85"
             dur="4.5s"
             repeatCount="indefinite"/>
  </circle>

</g>


<g fill="#22D3EE" filter="url(#glow)">

  <circle cx="300" cy="270" r="2">
    <animate attributeName="cy"
             values="270;245;270"
             dur="4.5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1160" cy="300" r="2">
    <animate attributeName="cx"
             values="1160;1135;1160"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="25" cy="330" r="2">
    <animate attributeName="cy"
             values="330;305;330"
             dur="3.5s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- ================================================= -->
<!-- LEFT CONTENT -->
<!-- ================================================= -->

<text x="65" y="62"
      fill="#A78BFA"
      font-family="Arial, Helvetica, sans-serif"
      font-size="12"
      font-weight="700"
      letter-spacing="3">
  MACHINE LEARNING
</text>


<text x="65" y="122"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="45"
      font-weight="800">
  Robust
</text>


<text x="65" y="171"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="45"
      font-weight="800">
  Regression
</text>


<text x="65" y="220"
      fill="#C084FC"
      font-family="Arial, Helvetica, sans-serif"
      font-size="45"
      font-weight="800">
  Engine
</text>


<text x="67" y="257"
      fill="#858093"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14">
  Regularization • Kernel Learning
</text>

<text x="67" y="279"
      fill="#858093"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14">
  Tree Models • Ensemble Learning
</text>


