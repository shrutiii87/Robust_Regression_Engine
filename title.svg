  <rect x="425" y="115"
        width="115"
        height="48"
        rx="10"
        fill="#111024"
        stroke="#40315E"/>

  <circle cx="444" cy="139"
          r="6"
          fill="#8B5CF6"/>

  <text x="460" y="136"
        fill="#D8D2E5"
        font-size="11"
        font-weight="700">
